[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nasute"
version = "0.2.0"
description = "A self-hosted eval harness for RAG and LLM systems: known-answer questions, a yes/no judge, error bars, and a static report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/nasute/assets/*.LICENSE"]
requires-python = ">=3.11"
dependencies = []   # standard library only; the report's chart code is vendored JavaScript in src/nasute/assets
keywords = ["eval", "evaluation", "rag", "llm", "llm-as-a-judge", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
nasute = "nasute:main"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "llms.txt", "nasute.example.toml"]
