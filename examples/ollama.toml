# Nasute settings for a model run locally by Ollama (https://ollama.com), with nothing leaving the machine.
# Copy to nasute.toml in a folder made by `nasute init`. First fetch the models, for example
#   ollama pull llama3.2 && ollama pull qwen2.5:14b
# Ollama serves an OpenAI-compatible API on port 11434. Every other setting is explained in nasute.example.toml.

dataset = "example"
concurrency = 1   # one local model does one request at a time

[judge]
url = "http://127.0.0.1:11434/v1"
# The judge should be at least as capable as the model it marks; a different model avoids marking its own homework.
model = "qwen2.5:14b"
timeout = 600   # a local judge on a laptop can be slow
mode = "knowledge"

[targets.mine]   # "mine" matches the example dataset `nasute init` writes
kind = "chat"
label = "Llama 3.2 on Ollama"
url = "http://127.0.0.1:11434/v1"
model = "llama3.2"
