# Nasute settings for a model behind any OpenAI-compatible API (a hosted service, vLLM, llama.cpp's server).
# Copy to nasute.toml in a folder made by `nasute init`, then change the addresses and model names.
# Keys never sit in this file: each "env:NAME" is read from that environment variable, for example
#   export MY_API_KEY="Bearer sk-..."
# Every other setting is explained in nasute.example.toml.

dataset = "example"
concurrency = 4   # a hosted API takes several requests at once; use 1 for a single local model
max_cost = 2.0    # US$ per run, answers plus judging, where the API reports cost; 0 = no cap

[judge]
url = "https://api.example.com/v1"
model = "judge-model-name"
headers = { Authorization = "env:MY_API_KEY" }
concurrency = 4
# "knowledge": for a plain chat model that cites no sources. Use "quick" or "claims" for a system that does.
mode = "knowledge"

[targets.mine]   # "mine" matches the example dataset `nasute init` writes
kind = "chat"   # the question goes as the user message; tokens and cost are read from the reply's usage
label = "Chat model"
url = "https://api.example.com/v1"
model = "model-under-test"
headers = { Authorization = "env:MY_API_KEY" }
