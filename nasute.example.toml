# Settings for nasute. Copy to nasute.toml and change what you need.
# Every setting has a default in the code, so this file is optional.

# Folders holding datasets/<name>/v<N>.jsonl. Relative folders start from this file's folder.
# Put questions about private documents in a folder outside the repo.
datasets = ["datasets"]

# Where each run is saved (one folder per run, named by its UTC time).
runs = "data/runs"

# Where the static report goes (index.html and its pages). Give it a folder of its own: it is rewritten.
report = "data/report"

# Where that folder is served, if it is (such as "https://reports.example.org/nasute"). The link printed when a run ends
# starts with it; empty, the link is a file:// address.
report_url = ""

# The dataset `run` asks when you give no --dataset.
dataset = ""

# The dataset `judge-check` uses: answers with known faults, to test the judge (see docs/how-to/judge-check.md).
# Empty: Nasute picks the one dataset whose header says "target": "judge", and stops if there is not exactly one.
# To switch off the automatic check before a run, set judge_check = false.
judge_set = ""

# How many retrieved sources count for hit rate and recall.
k = 5

# Seconds to wait for one answer before giving up on that question.
timeout = 180

# Ask only the first N questions. 0 means all of them.
limit = 0

# Times each question is asked. More than 1 shows how much answers wobble, and makes the error bars honest
# (repeats of one question are not independent). Each repeat is another trip to the language model.
repeats = 1

# A question counts as answered well when its correctness is at least this. Used for "passes every time"
# (pass^k), for failure causes, and for measured difficulty.
pass_at = 0.75

# The score difference the power line asks about: how many questions are needed to see a change this big
# (5% false alarms, 80% chance of seeing it).
detect = 0.05

# In "compare", a question whose score fell by more than this "got worse" (and rose, "got better").
# Also: the least that two repeats of one question must differ by to be listed as flaky.
worse_by = 0.2

# Measured difficulty. Once a question has this many attempts (across all runs of the same dataset file),
# it is flagged if it was labelled "easy" but passed less often than mislabel_easy_below, or labelled
# "hard" but passed more often than mislabel_hard_above.
min_attempts = 5
mislabel_easy_below = 0.5
mislabel_hard_above = 0.9

# Temperature sent to the judge, and to the system under test if it can use it (some fix their own).
# At 0 the judge gives the same reply every time, so repeats then differ only through the system itself;
# a warning says so when repeats is above 1. Each repeat also sends its own seed (its number: 1, 2, 3).
temperature = 0.0

# Seconds to wait after every call to the system and every judge call. Spares shared hardware: a local
# language model runs flat out otherwise, and the processor gets hot.
pause = 0

# Also wait, between calls, while the CPU is hotter than this many degrees C. 0 = off. Linux only.
max_temp = 0

# Questions asked at once. Leave at 1 for a language model that does one request at a time (llama.cpp with one slot does).
# Raise it only for an endpoint that takes parallel requests (a cloud service), or set it per target:
# [targets.<name>] concurrency = 8. Results are still saved in dataset order, and each repeat keeps its seed.
# "3 questions in a row" unreachable means 3 next to each other in the dataset, whatever order they finish in.
# `pause` applies after each call, per question being asked. --concurrency overrides it. (0.1.0 called this `workers`;
# that name still works.)
concurrency = 1

# A spending cap in US dollars for one run: the answers' cost plus the judge's, as the replies report them.
# Once the run has spent more, no new question or repeat starts; the ones being asked finish and are kept, so it can
# go over by that much. The run is then marked stopped early, with the reason. 0 = no cap. --max-cost overrides it.
# A local model or judge reports no cost; a warning says so once, and only reported cost is counted.
# With several targets (run_targets), each target's run has its own cap.
max_cost = 0

# Targets to run in turn on the same questions, each as its own run, then ranked by the main score with
# cost and speed (and the paired compare, for two). [] = the target the dataset's header names.
# --target, given once or more, overrides it. A target that fails does not stop the others. Handy in a profile.
run_targets = []

# If more than this share of answers could not be judged (judge errors), the run is marked incomplete.
# Judge errors are never counted against the system.
max_judge_errors = 0.1

# true: run judge-check first, so this run records a fresh judge reliability. Meant for profiles.
judge_check = false

[judge]
# Any OpenAI-compatible address that ends in /v1. Keep it separate from the system under test,
# so you can swap the judge without touching the thing you measure.
url = "http://127.0.0.1:8080/v1"
# Leave empty to use the first model the address lists.
model = ""
# Seconds to wait for one judging.
timeout = 240
# "quick": one request per answer; cheap. "claims": the answer and the reference are split into single
# facts and each is checked (RAGAS style); about twice as slow, and shows the facts behind every score.
# "knowledge": for plain chat models that cite nothing; is the key fact there, is anything false (extra true
# detail is fine). Use a judge at least as capable as the models it judges.
# Every way, the judge only says yes or no; the code counts.
mode = "quick"
# false: send "cache_prompt": false, so the model does not reuse earlier prompts. Questions cannot influence
# each other, and timings are honest (the same prompt took 35 s cold and 3 s cached). llama.cpp honours it;
# other OpenAI-compatible servers ignore the field. true is faster: fine for a quick look.
cache = false
# Tries after a judge reply that fails (timeout, unreadable JSON), with a short wait. Then that answer is left
# out of the judged scores (never counted against the system). A connection that cannot be made at all waits
# 5, 15 and 45 seconds, then gives up; unreachable on 3 questions in a row stops the run.
retries = 2
# Request headers for a judge that needs a key, e.g. { Authorization = "env:JUDGE_AUTH" }. A value "env:NAME" is read from the
# environment variable NAME, so the key never sits in this file. Runs record the header names only.
headers = {}
# Judge requests at once. 1 suits a local judge; a hosted one can take more (match concurrency, say).
concurrency = 1
# true: the built-in prompts put the answer first, between <<<ANSWER and ANSWER>>> markers, and the trusted
# reference and extracts after it, so an answer holding a line such as "REFERENCE: ..." cannot pass as one.
# The markers are taken out of every answer before judging, so an answer cannot close the fence early.
# false: the 0.1.0 prompts, unchanged, to compare with runs from 0.1.0. A changed fence makes marked scores
# not comparable, as a different judge model would.
fence = true

# Your own wording for a judge prompt: a text file per prompt, relative to this file. A prompt not named keeps
# the built-in text. Names: quick, split, check, knowledge, knowledge_abstain, abstain. Start from the real text
# with `nasute prompts export prompts`. A file must use exactly the {placeholders} of the prompt it replaces;
# write a literal brace as {{ or }}. Runs record a fingerprint of each prompt, and compare says when two runs
# used different ones. Check a changed prompt with `nasute judge-check` before trusting its scores.
[judge.prompts]
# quick = "prompts/quick.txt"

# Systems under test, one table each: [targets.<name>]. The name is yours. A dataset's header says which target it is for;
# `run --dataset X --target Y` asks the same questions of target Y instead. Settings differ by kind:
#   kind = "http"    any JSON endpoint (targets/http.py), below
#   kind = "chat"    an OpenAI-compatible chat API, no paths needed (targets/chat.py), below
#   kind = "my_target:ask"  your own Python function; the module may sit next to this file (docs/how-to/add-a-target.md)
# label, in any target: optional name the report shows instead of the target's id (tiles, headings, the Systems tab).
# model_url, in any target: optional /v1 address that names the model that writes the answers. Recorded in each run.
# concurrency, in any target: questions asked at once of this target, instead of the top-level concurrency.
# temperature, in any target: sent instead of the top-level temperature (the judge keeps that one).

[targets.web]
kind = "http"
url = "http://127.0.0.1:8000/chat"
method = "POST"
# headers: values "env:NAME" are read from the environment variable NAME.
headers = { Authorization = "env:MY_API_KEY" }
# The JSON body. {question} is replaced in every string (quotes and newlines are escaped for you). Not sent for GET:
# put {question} in url instead.
request = { messages = [{ role = "user", content = "{question}" }] }
# Paths into the reply: $.a.b, $.a[0].b, $.a[*].b (that subset only). answer is required; sources and extracts are optional.
answer = "$.choices[0].message.content"
sources = ""
# links: optional, a path to the address of each source, in the same order as sources (one for every source: if the counts differ,
# no links are used). The report makes a source a link only for an http(s) address or one starting with "/"; anything else stays plain text.
links = ""
extracts = ""
# tokens_in, tokens_out, cost: optional paths to the reply's usage figures, recorded with each answer and totalled per run.
# OpenAI-style replies: "$.usage.prompt_tokens" and "$.usage.completion_tokens"; OpenRouter also gives "$.usage.cost" (US dollars).
tokens_in = ""
tokens_out = ""
cost = ""
# timeout = 60   # seconds; the global timeout is used if this is not set

# A chat model behind an OpenAI-compatible API: the question is the user message. The answer, tokens and cost
# (if the API reports one) are read from the reply. No sources, so use judge mode knowledge or quick.
[targets.chat-model]
kind = "chat"
url = "http://127.0.0.1:11434/v1"   # the base address, ending /v1
model = "model-under-test"
# headers = { Authorization = "env:MY_API_KEY" }
# system = "Answer in one sentence."   # optional system prompt
# temperature = 0.0                     # optional; else the top-level temperature

# Profiles: a table of any of the settings above, merged over them by `nasute run --profile NAME`.
# Options on the command line (--limit, --repeats, --mode) still win.

# "Did I break anything?" after a change. A few minutes.
[profiles.smoke]
limit = 3
repeats = 1
judge_check = false
[profiles.smoke.judge]
mode = "quick"
cache = true

# Everything, three times each, the careful judge, a fresh judge check first. For overnight.
# The judge check needs a judge set (judge_set above, or one dataset whose target is "judge"); without one, set judge_check = false.
# All questions, including the ones with no answer, from the newest dataset version.
[profiles.deep]
limit = 0
repeats = 3
judge_check = true
pause = 5
[profiles.deep.judge]
mode = "claims"
cache = false
